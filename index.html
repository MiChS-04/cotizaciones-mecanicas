<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador - Servicios Generales Kylian</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f5;
      padding: 30px;
      color: #333;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #0056b3;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .header-info h1 {
      font-size: 24px;
      color: #0056b3;
      text-transform: uppercase;
    }
    .header-info p {
      font-size: 13px;
      color: #666;
    }
    .logo-container img {
      max-height: 80px;
      width: auto;
    }
    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }
    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .form-group.short {
      max-width: 200px;
    }
    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #444;
    }
    input[type="text"], 
    input[type="date"], 
    input[type="number"], 
    textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, 
    input[type="date"]:focus, 
    input[type="number"]:focus, 
    textarea:focus {
      border-color: #0056b3;
    }
    .input-readonly {
      background-color: #e9ecef;
      font-weight: bold;
      color: #0056b3;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    table th, table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }
    table th {
      background-color: #0056b3;
      color: white;
    }
    .btn-container {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 20px;
    }
    button {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit {
      background-color: #28a745;
      color: white;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
    .btn-reset {
      background-color: #dc3545;
      color: white;
    }
    .btn-reset:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

    <div class="header">

      </div>
      <div class="header-info">
        <h1>Servicios Generales Kylian</h1>
        <p>RUC: 10458796321 | Tel: +51 987 654 321</p>
        <p>Email: contacto@servicioskylian.com</p>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group short">
        <label for="inputNumero">N° Cotización:</label>
        <input type="text" id="inputNumero" class="input-readonly" readonly>
      </div>
      <div class="form-group short">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha">
      </div>
      <div class="form-group">
        <label for="cliente">Cliente / Empresa:</label>
        <input type="text" id="cliente" placeholder="Nombre completo o Razón Social">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" placeholder="Dirección del cliente">
      </div>
      <div class="form-group short">
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" placeholder="Número de contacto">
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Descripción del Servicio</th>
          <th style="width: 100px;">Cantidad</th>
          <th style="width: 120px;">Precio Unit.</th>
          <th style="width: 120px;">Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" style="width: 100%;" placeholder="Descripción del trabajo"></td>
          <td><input type="number" style="width: 100%;" value="1"></td>
          <td><input type="number" style="width: 100%;" placeholder="0.00"></td>
          <td><input type="text" style="width: 100%;" class="input-readonly" value="S/ 0.00" readonly></td>
        </tr>
      </tbody>
    </table>

    <div class="btn-container">
      <button class="btn-reset" onclick="reiniciarCorrelativo()">Resetear a N° 020</button>
      <button class="btn-submit" onclick="generarCotizacion()">Generar Cotización</button>
    </div>
  </div>

  <script>
    // Inicialización del correlativo comenzando en 20 por defecto
    let numeroActual = parseInt(localStorage.getItem('numCotizacionKylian')) || 20;

    // Colocar fecha actual por defecto
    document.getElementById('fecha').valueAsDate = new Date();

    function actualizarNumeroInput() {
      // Formato con ceros a la izquierda (ej: N° 020)
      document.getElementById('inputNumero').value = 'N° ' + String(numeroActual).padStart(3, '0');
    }

    function generarCotizacion() {
      const cliente = document.getElementById('cliente').value;
      if (!cliente) {
        alert('Por favor, ingrese el nombre del cliente.');
        return;
      }

      alert('Cotización ' + document.getElementById('inputNumero').value + ' generada con éxito para ' + cliente + '.');
      
      // Incrementar y guardar en LocalStorage para la siguiente cotización
      numeroActual++;
      localStorage.setItem('numCotizacionKylian', numeroActual);
      actualizarNumeroInput();
    }

    function reiniciarCorrelativo() {
      if (confirm('¿Deseas reiniciar el contador a N° 020?')) {
        numeroActual = 20;
        localStorage.setItem('numCotizacionKylian', numeroActual);
        actualizarNumeroInput();
      }
    }

    // Cargar número al abrir la página
    actualizarNumeroInput();
  </script>

</body>
</html>
